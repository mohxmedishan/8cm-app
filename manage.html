<!-- INSERT INTO #manageTabs -->
<button class="manage-tab" data-tab="monitors" type="button">Monitors</button>

<!-- INSERT INTO #manageContent -->
<!-- MONITORS -->
<div class="manage-panel" data-panel="monitors">
  <div class="today-panel">
    <div class="today-panel-head">
      <h3 class="today-panel-title">Monitors</h3>
      <span class="today-note">Gmail addresses only</span>
    </div>
    <form class="task-form" id="monitorForm">
      <div class="task-form-grid">
        <label class="field field-wide">
          <span>Gmail address</span>
          <input type="email" name="email" placeholder="name@gmail.com" required>
        </label>
      </div>
      <p class="auth-error" id="monitorFormError" hidden></p>
      <div class="task-form-actions">
        <button type="submit" class="btn btn-add-task btn-small">Add monitor</button>
      </div>
    </form>
    <div class="task-list" id="monitorList"></div>
  </div>
</div>
